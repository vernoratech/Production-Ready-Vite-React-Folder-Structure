<!DOCTYPE html>
<html>

<head>
  <title>Clear Storage</title>
</head>

<body>
  <h1>Clear Browser Storage</h1>
  <button onclick="clearStorage()">Clear localStorage</button>
  <div id="status"></div>

  <script>
    function clearStorage() {
      localStorage.clear();
      document.getElementById('status').innerHTML = 'localStorage cleared! You can now close this tab and refresh your app.';
    }

    // Show current storage
    window.onload = function () {
      const authToken = localStorage.getItem('authAccessToken');
      const setupCompleted = localStorage.getItem('restaurantSetupCompleted');
      document.getElementById('status').innerHTML = `
                <p>Current storage:</p>
                <p>authAccessToken: ${authToken || 'null'}</p>
                <p>restaurantSetupCompleted: ${setupCompleted || 'null'}</p>
            `;
    }
  </script>
</body>

</html>
